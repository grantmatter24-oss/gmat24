<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Loop Pad</title>
<style>
  :root {
    --bg: #0b0b10; --panel: #15151d; --line: #262633; --text: #e9e9f2; --dim: #8a8aa0;
    --rec: #ff3b4e; --play: #35e08a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { min-height: 100vh; display: flex; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 15px; letter-spacing: .25em; text-transform: uppercase; margin: 4px 0 0; color: var(--dim); font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  button, select { font: inherit; color: var(--text); background: #1f1f2b; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; cursor: pointer; touch-action: manipulation; user-select: none; }
  button:active { transform: scale(.97); }
  button.on { border-color: currentColor; }
  #rec.on { color: var(--rec); background: rgba(255,59,78,.14); animation: pulse 1s infinite; }
  #play.on { color: var(--play); background: rgba(53,224,138,.12); }
  #metro.on { color: #ffd24a; background: rgba(255,210,74,.1); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255,59,78,.25); } }
  label { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
  input[type=range] { accent-color: #8c7bff; width: 120px; }
  #bpmv { color: var(--text); min-width: 2.2em; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  #steps { display: grid; gap: 3px; }
  .row { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; }
  .step { height: 8px; border-radius: 3px; background: #23232f; }
  .step.beat { background: #2f2f40; }
  .step.has { background: #6b5cff; }
  .step.now { background: var(--play); }
  #pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .pad { position: relative; aspect-ratio: 1; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--c) 45%, #000);
    background: color-mix(in srgb, var(--c) 16%, var(--panel)); color: var(--text);
    display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
    padding: 10px; text-align: left; transition: background .12s, box-shadow .12s, transform .06s; }
  .pad b { font-size: 14px; letter-spacing: .04em; }
  .pad small { color: var(--dim); font-size: 11px; }
  .pad kbd { position: absolute; top: 8px; right: 10px; font: 600 11px ui-monospace, monospace; color: var(--dim); }
  .pad.hit { background: var(--c); color: #0b0b10; box-shadow: 0 0 28px color-mix(in srgb, var(--c) 70%, transparent); transform: scale(.97); transition: none; }
  .pad.hit small, .pad.hit kbd { color: rgba(0,0,0,.6); }
  #msg { color: var(--dim); font-size: 12px; min-height: 1.4em; }
  .note { color: var(--dim); font-size: 11px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Loop Pad</h1>

  <div class="bar">
    <button id="rec">● Rec</button>
    <button id="play">▶ Play</button>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
    <button id="demo">Demo beat</button>
  </div>

  <div class="bar">
    <label>BPM <input id="bpm" type="range" min="90" max="175" value="132"><span id="bpmv">132</span></label>
    <label>Bars
      <select id="bars"><option>1</option><option>2</option><option selected>4</option></select>
    </label>
    <button id="metro" class="on">Click</button>
  </div>

  <div id="steps"></div>
  <div id="pads"></div>
  <div id="msg"></div>
  <div class="note">
    Sounds are synthesized in the browser in the style of UK house / breaks / garage (Kettama, Prospa, Riordan) &mdash; not samples from their records.
    Keys: 1-4, Q-R, A-F, Z-V play pads &middot; Space = play/stop &middot; Enter = record. Hits snap to 16th notes.
  </div>
</main>

<script>
"use strict";

/* ---------- audio engine ---------- */
let ctx, master, reverbSend, noiseBuf;

function initAudio() {
  if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = ctx.createGain(); master.gain.value = 0.9;
  master.connect(comp); comp.connect(ctx.destination);

  // noise
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  // simple generated reverb
  const len = ctx.sampleRate * 1.6, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const ch = ir.getChannelData(c);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  const conv = ctx.createConvolver(); conv.buffer = ir;
  reverbSend = ctx.createGain(); reverbSend.gain.value = 0.35;
  reverbSend.connect(conv); conv.connect(master);
}

function noise(t, dur) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  s.start(t, Math.random(), dur + 0.05); return s;
}
function env(g, t, peak, a, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function chain(t, nodes) { for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]); }
function osc(type, f, t, dur) {
  const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(t + dur + 0.05); return o;
}
function filt(type, f, q) {
  const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; return b;
}
function gain(v) { const g = ctx.createGain(); g.gain.value = v; return g; }
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);

const SOUNDS = {
  kick(t) {
    const o = osc("sine", 160, t, 0.5), g = ctx.createGain();
    o.frequency.exponentialRampToValueAtTime(46, t + 0.14);
    env(g, t, 1.0, 0.002, 0.45);
    chain(t, [o, g, master]);
    const c = noise(t, 0.02), cf = filt("lowpass", 3000), cg = ctx.createGain();
    env(cg, t, 0.35, 0.001, 0.02); chain(t, [c, cf, cg, master]);
  },
  sub(t) {
    const o = osc("sine", 58, t, 0.9), g = ctx.createGain(), sh = ctx.createWaveShaper();
    const curve = new Float32Array(256); for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 2.2); }
    sh.curve = curve;
    o.frequency.exponentialRampToValueAtTime(48, t + 0.5);
    env(g, t, 0.9, 0.01, 0.85);
    chain(t, [o, sh, g, master]);
  },
  clap(t) {
    const f = filt("bandpass", 1300, 1.2), g = ctx.createGain(), n = noise(t, 0.4);
    g.gain.setValueAtTime(0.0001, t);
    [0, 0.011, 0.023].forEach(o => { g.gain.linearRampToValueAtTime(0.9, t + o + 0.002); g.gain.exponentialRampToValueAtTime(0.12, t + o + 0.01); });
    g.gain.linearRampToValueAtTime(0.8, t + 0.035); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    chain(t, [n, f, g, master]); g.connect(reverbSend);
  },
  snare(t) {
    const o = osc("triangle", 200, t, 0.2), og = ctx.createGain();
    o.frequency.exponentialRampToValueAtTime(130, t + 0.1); env(og, t, 0.6, 0.001, 0.14);
    chain(t, [o, og, master]);
    const n = noise(t, 0.25), f = filt("highpass", 1800), ng = ctx.createGain();
    env(ng, t, 0.7, 0.001, 0.2); chain(t, [n, f, ng, master]);
  },
  chat(t) {
    const n = noise(t, 0.08), f = filt("highpass", 8000), g = ctx.createGain();
    env(g, t, 0.45, 0.001, 0.045); chain(t, [n, f, g, master]);
  },
  ohat(t) {
    const n = noise(t, 0.4), f = filt("highpass", 7000), g = ctx.createGain();
    env(g, t, 0.4, 0.002, 0.3); chain(t, [n, f, g, master]);
  },
  shaker(t) {
    const n = noise(t, 0.2), f = filt("bandpass", 6500, 1.5), g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    chain(t, [n, f, g, master]);
  },
  rim(t) {
    const o = osc("square", 1750, t, 0.05), f = filt("bandpass", 1750, 4), g = ctx.createGain();
    env(g, t, 0.35, 0.001, 0.04); chain(t, [o, f, g, master]);
    const o2 = osc("triangle", 480, t, 0.08), g2 = ctx.createGain(); env(g2, t, 0.4, 0.001, 0.07); chain(t, [o2, g2, master]);
  },
  tom(t) {
    const o = osc("sine", 230, t, 0.4), g = ctx.createGain();
    o.frequency.exponentialRampToValueAtTime(110, t + 0.25); env(g, t, 0.8, 0.002, 0.35); chain(t, [o, g, master]);
  },
  conga(t) {
    const o = osc("sine", 360, t, 0.25), g = ctx.createGain();
    o.frequency.exponentialRampToValueAtTime(280, t + 0.08); env(g, t, 0.7, 0.001, 0.2); chain(t, [o, g, master]);
    const n = noise(t, 0.03), f = filt("bandpass", 2500, 2), ng = ctx.createGain(); env(ng, t, 0.2, 0.001, 0.025); chain(t, [n, f, ng, master]);
  },
  stab(t) { // detuned saw minor-7 house stab
    const f = filt("lowpass", 600, 4), g = ctx.createGain();
    f.frequency.setValueAtTime(5000, t); f.frequency.exponentialRampToValueAtTime(500, t + 0.28);
    env(g, t, 0.28, 0.003, 0.4);
    [50, 57, 60, 65].forEach(n => [-9, 9].forEach(dt => {
      const o = osc("sawtooth", mtof(n + 12), t, 0.45); o.detune.value = dt; o.connect(f);
    }));
    chain(t, [f, g, master]); g.connect(reverbSend);
  },
  organ(t) { // garage organ chord
    const f = filt("lowpass", 2400), g = ctx.createGain();
    env(g, t, 0.22, 0.005, 0.5);
    [57, 60, 64, 69].forEach(n => { const o = osc("square", mtof(n), t, 0.55); o.connect(f); });
    chain(t, [f, g, master]); g.connect(reverbSend);
  },
  acid(t) { // squelchy 303-ish
    const o = osc("sawtooth", 55, t, 0.4), f = filt("lowpass", 300, 14), g = ctx.createGain();
    f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(180, t + 0.3);
    env(g, t, 0.55, 0.003, 0.35); chain(t, [o, f, g, master]);
  },
  reese(t) { // detuned dark bass
    const f = filt("lowpass", 500, 2), g = ctx.createGain();
    f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(260, t + 0.8);
    env(g, t, 0.5, 0.01, 0.9);
    [-14, 0, 14].forEach(dt => { const o = osc("sawtooth", 41.2, t, 0.95); o.detune.value = dt; o.connect(f); });
    chain(t, [f, g, master]);
  },
  vox(t) { // formant "ah -> oo" chop
    const src = osc("sawtooth", 294, t, 0.4), g = ctx.createGain();
    src.frequency.linearRampToValueAtTime(330, t + 0.12);
    const f1 = filt("bandpass", 800, 8), f2 = filt("bandpass", 1200, 10);
    f1.frequency.exponentialRampToValueAtTime(320, t + 0.3); f2.frequency.exponentialRampToValueAtTime(800, t + 0.3);
    const mix = gain(1); src.connect(f1); src.connect(f2); f1.connect(mix); f2.connect(mix);
    env(g, t, 1.3, 0.01, 0.34); chain(t, [mix, g, master]); g.connect(reverbSend);
  },
  riser(t) {
    const n = noise(t, 1.6), f = filt("bandpass", 400, 3), g = ctx.createGain();
    f.frequency.exponentialRampToValueAtTime(9000, t + 1.4);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 1.4); g.gain.linearRampToValueAtTime(0.0001, t + 1.5);
    chain(t, [n, f, g, master]); g.connect(reverbSend);
  },
};

const PADS = [
  { id: "kick",   name: "Kick",     sub: "4x4",        key: "1", c: "#ff5470" },
  { id: "sub",    name: "Sub 808",  sub: "bass",       key: "2", c: "#ff7a45" },
  { id: "clap",   name: "Clap",     sub: "2 & 4",      key: "3", c: "#ffb347" },
  { id: "snare",  name: "Snare",    sub: "breaks",     key: "4", c: "#ffd24a" },
  { id: "chat",   name: "Hat",      sub: "closed",     key: "q", c: "#c6e84a" },
  { id: "ohat",   name: "Open Hat", sub: "off-beat",   key: "w", c: "#7ee06a" },
  { id: "shaker", name: "Shaker",   sub: "swing",      key: "e", c: "#35e08a" },
  { id: "rim",    name: "Rim",      sub: "garage",     key: "r", c: "#2fd6c5" },
  { id: "tom",    name: "Tom",      sub: "perc",       key: "a", c: "#3ec1ff" },
  { id: "conga",  name: "Conga",    sub: "perc",       key: "s", c: "#4f9bff" },
  { id: "stab",   name: "Stab",     sub: "m7 chord",   key: "d", c: "#7b83ff" },
  { id: "organ",  name: "Organ",    sub: "chord",      key: "f", c: "#9a7bff" },
  { id: "acid",   name: "Acid",     sub: "squelch",    key: "z", c: "#c07bff" },
  { id: "reese",  name: "Reese",    sub: "dark bass",  key: "x", c: "#e36bff" },
  { id: "vox",    name: "Vox Chop", sub: "ah-oo",      key: "c", c: "#ff6bd0" },
  { id: "riser",  name: "Riser",    sub: "fx",         key: "v", c: "#ff6b9a" },
];

/* ---------- sequencer state ---------- */
const S = {
  bpm: 132, bars: 4, playing: false, recording: false, metro: true,
  events: [],            // {step, pad, sess}
  sess: 0,
  nextStep: 0, nextTime: 0,
  queue: [],             // visual events {time, step, pads[]}
};
const total = () => S.bars * 16;
const stepDur = () => 60 / S.bpm / 4;

function trigger(i, t) { SOUNDS[PADS[i].id](t); }

function schedule() {
  while (S.nextTime < ctx.currentTime + 0.12) {
    const st = S.nextStep, t = S.nextTime, hits = [];
    if (S.metro && st % 4 === 0) {
      const o = osc("square", st % 16 === 0 ? 1600 : 1000, t, 0.03), g = ctx.createGain();
      env(g, t, 0.08, 0.001, 0.025); chain(t, [o, g, master]);
    }
    for (const e of S.events) if (e.step === st) { trigger(e.pad, t); hits.push(e.pad); }
    S.queue.push({ time: t, step: st, hits });
    S.nextStep = (st + 1) % total();
    S.nextTime += stepDur();
  }
}
let timer = null;
function start() {
  initAudio();
  if (S.playing) return;
  S.playing = true; S.nextStep = 0; S.nextTime = ctx.currentTime + 0.06;
  timer = setInterval(schedule, 25);
  ui();
}
function stop() {
  S.playing = false; S.recording = false;
  clearInterval(timer); S.queue = [];
  ui();
}
function curStep() {
  const pos = S.nextStep - (S.nextTime - ctx.currentTime) / stepDur();
  return ((Math.round(pos) % total()) + total()) % total();
}

function hitPad(i) {
  initAudio();
  trigger(i, ctx.currentTime);
  flash(i);
  if (S.recording && S.playing) {
    S.events.push({ step: curStep(), pad: i, sess: S.sess });
    renderSteps();
  }
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const padEls = [];
PADS.forEach((p, i) => {
  const b = document.createElement("button");
  b.className = "pad"; b.style.setProperty("--c", p.c);
  b.innerHTML = `<kbd>${p.key.toUpperCase()}</kbd><b>${p.name}</b><small>${p.sub}</small>`;
  b.addEventListener("pointerdown", e => { e.preventDefault(); hitPad(i); });
  $("pads").appendChild(b); padEls.push(b);
});
function flash(i) {
  const el = padEls[i]; el.classList.add("hit");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("hit"), 90);
}

let stepEls = [];
function renderSteps() {
  const wrap = $("steps");
  if (stepEls.length !== total()) {
    wrap.innerHTML = ""; stepEls = [];
    for (let b = 0; b < S.bars; b++) {
      const r = document.createElement("div"); r.className = "row";
      for (let s = 0; s < 16; s++) {
        const d = document.createElement("div"); d.className = "step" + (s % 4 === 0 ? " beat" : "");
        r.appendChild(d); stepEls.push(d);
      }
      wrap.appendChild(r);
    }
  }
  const has = new Set(S.events.map(e => e.step));
  stepEls.forEach((el, i) => el.classList.toggle("has", has.has(i)));
}

let lastNow = -1;
function frame() {
  if (ctx && S.playing) {
    const now = ctx.currentTime;
    while (S.queue.length && S.queue[0].time <= now) {
      const q = S.queue.shift();
      if (lastNow >= 0 && stepEls[lastNow]) stepEls[lastNow].classList.remove("now");
      if (stepEls[q.step]) stepEls[q.step].classList.add("now");
      lastNow = q.step;
      q.hits.forEach(flash);
    }
  } else if (lastNow >= 0) {
    if (stepEls[lastNow]) stepEls[lastNow].classList.remove("now");
    lastNow = -1;
  }
  requestAnimationFrame(frame);
}

function ui() {
  $("rec").classList.toggle("on", S.recording);
  $("play").classList.toggle("on", S.playing);
  $("play").textContent = S.playing ? "■ Stop" : "▶ Play";
  $("metro").classList.toggle("on", S.metro);
  $("msg").textContent = S.recording ? "Recording - hit pads, they snap to the loop and keep looping."
    : S.playing ? "Looping. Hit Rec to overdub more layers." : "Hit Rec and play pads, or tap Demo beat to start.";
}

$("rec").onclick = () => {
  initAudio();
  if (S.recording) { S.recording = false; ui(); return; }
  S.sess++;
  if (!S.playing) start();
  S.recording = true; ui();
};
$("play").onclick = () => S.playing ? stop() : start();
$("undo").onclick = () => {
  if (!S.events.length) return;
  const last = Math.max(...S.events.map(e => e.sess));
  S.events = S.events.filter(e => e.sess !== last);
  renderSteps();
};
$("clear").onclick = () => { S.events = []; renderSteps(); };
$("metro").onclick = () => { S.metro = !S.metro; ui(); };
$("bpm").oninput = e => { S.bpm = +e.target.value; $("bpmv").textContent = S.bpm; };
$("bars").onchange = e => { S.bars = +e.target.value; S.nextStep %= total(); renderSteps(); };
$("demo").onclick = () => {
  initAudio();
  S.sess++;
  const add = (pad, steps) => steps.forEach(s => { for (let b = 0; b < S.bars; b++) S.events.push({ step: b * 16 + s, pad, sess: S.sess }); });
  add(0, [0, 4, 8, 12]);         // kick 4x4
  add(2, [4, 12]);               // clap
  add(5, [2, 6, 10, 14]);        // open hat off-beat
  add(4, [0, 3, 7, 11, 15]);     // hats
  add(6, [1, 5, 9, 13]);         // shaker
  add(1, [0, 10]);               // sub
  renderSteps();
  if (!S.playing) start();
};

const KEYS = Object.fromEntries(PADS.map((p, i) => [p.key, i]));
const down = new Set();
addEventListener("keydown", e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); initAudio(); $("play").click(); return; }
  if (e.code === "Enter") { e.preventDefault(); $("rec").click(); return; }
  const i = KEYS[e.key.toLowerCase()];
  if (i !== undefined && !down.has(e.key)) { down.add(e.key); hitPad(i); }
});
addEventListener("keyup", e => down.delete(e.key));

renderSteps(); ui(); requestAnimationFrame(frame);
</script>
</body>
</html>
